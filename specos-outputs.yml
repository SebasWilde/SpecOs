# specos-outputs.yml
# Team output configuration for SpecOS v3.
# Generated by /specos-init. Modify this file for your team's tools.
# All integrations are disabled by default. Enable and configure as needed.

version: "1.0"
language: en

team:
  lead: human
  qa: human           # human | agent | both

ids:
  task_prefix: SP     # default task ID prefix (e.g. SP-01). Replace with your prefix.
  testcase_prefix: TC # default test case ID prefix (e.g. TC-01)

integrations:
  jira:
    enabled: false
    mcp: null         # MCP server name when enabled (v4)
  confluence:
    enabled: false
    mcp: null
  notion:
    enabled: false
  linear:
    enabled: false
  github_issues:
    enabled: false
  slack:
    enabled: false

outputs:
  tasks:
    destination: manual   # manual = copy-paste from agent output
  testcases:
    destination: manual
  confluence_doc:
    destination: manual

# To enable an integration in v4:
# 1. Set enabled: true
# 2. Set mcp: to the MCP server name configured in your agent
# 3. Run /specos-distribute — the agent will push output automatically
#
# For v3 (manual mode): run /specos-distribute and copy the output to your tool.
